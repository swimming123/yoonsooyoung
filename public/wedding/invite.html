<style>
  :root{
    --paper:#FBF8F3; --ink:#2A2620; --ink-soft:#7A7266; --line:#E7DFD2; --accent:#9C8563;
    --tx:0; --ty:0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    -webkit-font-smoothing:antialiased; word-break:keep-all;
  }
  .card{ max-width:460px; margin:0 auto; min-height:100vh; background:#fff; box-shadow:0 0 40px rgba(0,0,0,0.06); position:relative; overflow-x:hidden; }

  /* ===== 모션 공통: 기울기(--tx,--ty: -1~1)에 따라 --d(px)만큼 이동 ===== */
  .px{ transform:translate3d(calc(var(--tx)*var(--d,0)*1px),calc(var(--ty)*var(--d,0)*1px),0); will-change:transform; }
  .rv{ opacity:0; transform:translateY(22px); transition:opacity .9s ease, transform .9s ease; }
  .rv.in{ opacity:1; transform:none; }

  /* ===== 사진 슬라이드 ===== */
  .carousel{ position:relative; width:100%; aspect-ratio:4/5; background:#EFEAE0; overflow:hidden; }
  .carousel-track{
    display:flex; width:100%; height:100%; overflow-x:auto; scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .carousel-track::-webkit-scrollbar{ display:none; }
  .carousel-slide{ flex:0 0 100%; scroll-snap-align:center; height:100%; position:relative; overflow:hidden; }
  .carousel-slide img.ph{
    position:absolute; left:-9%; top:-9%; width:118%; height:118%; object-fit:cover; display:block;
    --d:-20; pointer-events:none; -webkit-user-drag:none;
  }
  .glare{
    position:absolute; inset:0; pointer-events:none; mix-blend-mode:soft-light;
    background:radial-gradient(circle at calc(50% + var(--tx)*55%) calc(40% + var(--ty)*55%), rgba(255,255,255,.75), transparent 55%);
  }
  .bokeh{ position:absolute; border-radius:50%; background:rgba(255,255,255,.5); pointer-events:none; filter:blur(1px); }
  .tilthint{ position:absolute; top:12px; right:12px; z-index:3; font-size:11px; color:#fff; background:rgba(0,0,0,.28); padding:5px 10px; border-radius:20px; backdrop-filter:blur(4px); pointer-events:none; transition:opacity .6s; }
  .carousel-dots{ position:absolute; bottom:14px; left:0; right:0; display:flex; justify-content:center; gap:6px; z-index:3; }
  .carousel-arrow{
    position:absolute; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%;
    background:rgba(255,255,255,0.85); border:none; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:15px; color:var(--ink); z-index:4; box-shadow:0 1px 4px rgba(0,0,0,0.15);
  }
  .carousel-arrow.prev{ left:10px; }
  .carousel-arrow.next{ right:10px; }
  .carousel-arrow:hover{ background:#fff; }
  .carousel-dot{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.55); transition:all .3s; }
  .carousel-dot.active{ background:#fff; width:18px; border-radius:4px; }
  .carousel-empty{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:13px; }

  /* ===== 본문 ===== */
  .content{ padding:38px 30px 50px; text-align:center; }
  .eyebrow{ font-size:11.5px; letter-spacing:0.18em; color:var(--accent); margin:0 0 14px; }
  .names{ font-family:'Noto Serif KR', serif; font-size:26px; font-weight:500; margin:0; line-height:1.5; }
  .names .amp{ color:var(--accent); font-weight:400; margin:0 8px; font-size:20px; display:inline-block; }
  .shine{
    display:inline-block;
    background:linear-gradient(110deg, var(--ink) 0%, var(--ink) calc(38% + var(--tx)*30%), #C9A97A calc(50% + var(--tx)*30%), var(--ink) calc(62% + var(--tx)*30%), var(--ink) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  }
  .phrase{ margin:26px 0; font-size:14px; line-height:1.9; color:var(--ink-soft); white-space:pre-wrap; padding:0 4px; }
  .divider{ width:32px; height:1px; background:var(--line); margin:26px auto; }
  .datetime{ font-family:'Noto Serif KR', serif; font-size:19px; margin:0 0 6px; }
  .datetime-sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 22px; }
  .venue-name{ font-size:15px; font-weight:500; margin:0 0 4px; }
  .venue-address{ font-size:12.5px; color:var(--ink-soft); margin:0; }
  .heading{ font-family:'Noto Serif KR', serif; font-size:20px; font-weight:500; margin:0 0 14px; line-height:1.5; white-space:pre-wrap; }
  .map-actions{ display:flex; gap:8px; justify-content:center; margin-top:16px; }
  .map-btn{
    font:inherit; font-size:13px; padding:9px 16px; border-radius:20px; border:1px solid var(--line);
    background:#fff; color:var(--ink); text-decoration:none; cursor:pointer;
  }
  .map-btn.primary{ background:#03C75A; border-color:#03C75A; color:#fff; }
  .loading{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:13px; }

  /* 달력 · D-day */
  .cal{ margin:0 auto 18px; max-width:290px; font-size:12.5px; }
  .cal .row{ display:grid; grid-template-columns:repeat(7,1fr); row-gap:7px; }
  .cal .hd{ color:var(--ink-soft); font-size:11px; margin-bottom:9px; }
  .cal .sun{ color:#C0716E; }
  .cal .me{ position:relative; color:#fff; z-index:1; }
  .cal .me::before{ content:""; position:absolute; left:50%; top:50%; width:28px; height:28px; border-radius:50%; background:var(--accent); transform:translate(-50%,-50%); z-index:-1; box-shadow:0 4px 12px rgba(156,133,99,.45); }
  .dday{ font-size:12.5px; color:var(--ink-soft); margin:0 0 26px; }
  .dday b{ color:var(--accent); font-weight:700; }

  /* ===== 갤러리 (그리드) ===== */
  .gallery{ margin-top:6px; }
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:18px; perspective:700px; }
  .tile{
    position:relative; aspect-ratio:3/4; overflow:hidden; border-radius:6px; background:#EFEAE0; padding:0; border:0; cursor:pointer;
    transform:rotateY(calc(var(--tx)*7deg)) rotateX(calc(var(--ty)*-7deg)); transition:transform .15s linear;
    box-shadow:0 6px 16px rgba(60,45,30,.12);
  }
  .tile img{
    position:absolute; left:-12%; top:-12%; width:124%; height:124%; object-fit:cover; display:block; pointer-events:none;
    transform:translate3d(calc(var(--tx)*-8px),calc(var(--ty)*-8px),0);
  }
  .tile:nth-child(3n+2){ margin-top:14px; }

  .lb{ position:fixed; inset:0; z-index:60; background:rgba(20,14,12,.92); display:none; align-items:center; justify-content:center; }
  .lb.on{ display:flex; }
  .lb .frame{ width:min(92vw,440px); height:76vh; position:relative; overflow:hidden; border-radius:8px; }
  .lb .frame img{ position:absolute; left:-6%; top:-6%; width:112%; height:112%; object-fit:cover; --d:-12; }
  .lb button{ position:absolute; background:none; border:0; color:#fff; cursor:pointer; font:inherit; }
  .lb .x{ top:14px; right:16px; font-size:28px; padding:6px 10px; }
  .lb .nv{ top:50%; transform:translateY(-50%); font-size:34px; padding:12px; opacity:.85; }
  .lb .pv{ left:4px; } .lb .nx{ right:4px; }
  .lb .cnt{ position:absolute; bottom:18px; left:0; right:0; text-align:center; color:#fff; font-size:12px; letter-spacing:.2em; opacity:.7; }

  /* ===== 인트로 · 꽃잎 · 모션 버튼 ===== */
  .intro{
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(circle at 50% 30%, #FFFAF4, #F1E7DA 70%); transition:opacity .8s ease, visibility .8s; padding:0 24px;
  }
  .intro.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .intro .orb{ position:absolute; border-radius:50%; filter:blur(32px); opacity:.55; }
  .intro .small{ letter-spacing:.3em; font-size:11px; color:var(--accent); position:relative; }
  .intro h1{ font-family:'Noto Serif KR',serif; font-weight:500; font-size:28px; margin:18px 0 8px; letter-spacing:.04em; position:relative; }
  .intro p{ font-size:13px; color:var(--ink-soft); line-height:1.9; margin:0; position:relative; }
  .open-btn{ position:relative; margin-top:32px; padding:14px 34px; border:1px solid var(--accent); border-radius:40px; color:var(--accent); letter-spacing:.2em; font:inherit; font-size:13px; background:rgba(255,255,255,.65); cursor:pointer; }
  .open-btn:active{ background:var(--accent); color:#fff; }
  canvas#petals{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:40; }
  .motion-btn{
    position:fixed; right:12px; bottom:max(12px,env(safe-area-inset-bottom)); z-index:45; font:inherit; font-size:11px;
    padding:8px 13px; border-radius:20px; border:0; color:#fff; background:rgba(42,38,32,.62); backdrop-filter:blur(6px); cursor:pointer; display:none;
  }
  .toast{ position:fixed; top:16px; left:50%; transform:translate(-50%,-80px); z-index:70; background:rgba(42,38,32,.85); color:#fff; font-size:12px; padding:9px 16px; border-radius:20px; transition:transform .4s; pointer-events:none; }
  .toast.on{ transform:translate(-50%,0); }

  @media (prefers-reduced-motion:reduce){
    .px,.tile,.tile img{ transform:none !important; }
    .rv{ opacity:1; transform:none; }
  }
</style>

<body>
  <canvas id="petals"></canvas>
  <div class="toast" id="toast"></div>

  <div class="card" id="card" style="display:none;"><div class="content" id="content"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCv4C_YQfPmq3vWAzfH9hicceBKn7uGDcQ",
  authDomain: "wedding-log-ab8be.firebaseapp.com",
  projectId: "wedding-log-ab8be",
  storageBucket: "wedding-log-ab8be.firebasestorage.app",
  messagingSenderId: "1051939244748",
  appId: "1:1051939244748:web:42e1b03187ce036f8c9069",
  measurementId: "G-MMCL30SMFV"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const invitationRef = doc(db, "app", "invitation");
const photosCol = collection(db, "invitationPhotos");

const $ = s => document.querySelector(s);
const wantedId = new URLSearchParams(location.search).get('d');
let invData = null;
let photos = [];
let gotInv = false, gotPhotos = false;

function fmtDateTime(dtStr){
  if(!dtStr) return {main:'-', sub:''};
  const d = new Date(dtStr);
  if(isNaN(d)) return {main:'-', sub:''};
  const days = ['일','월','화','수','목','금','토'];
  const y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
  const h = d.getHours();
  const min = String(d.getMinutes()).padStart(2,'0');
  const ampm = h < 12 ? '오전' : '오후';
  const h12 = (h % 12) === 0 ? 12 : (h % 12);
  return {
    main: `${y}년 ${m}월 ${day}일 ${days[d.getDay()]}요일`,
    sub: `${ampm} ${h12}시${min !== '00' ? ' ' + min + '분' : ''}`
  };
}
const DEFAULT_BLOCKS = [
  {type:'photos'}, {type:'eyebrow', text:'WE ARE GETTING MARRIED'}, {type:'names'},
  {type:'text', text:''}, {type:'divider'}, {type:'datetime'}, {type:'venue'}
];

// 표시할 시안 결정: ?d=ID → 대표 시안 → 구버전(평면) 문서
function pickDraft(){
  const data = invData || {};
  const drafts = data.drafts || {};
  const ids = Object.keys(drafts);
  if(ids.length){
    const id = (wantedId && drafts[wantedId]) ? wantedId : (drafts[data.activeId] ? data.activeId : ids[0]);
    const d = drafts[id];
    return { id, d, blocks: (d.blocks && d.blocks.length) ? d.blocks : DEFAULT_BLOCKS };
  }
  const blocks = DEFAULT_BLOCKS.map(b => b.type === 'text' ? {type:'text', text:data.phrase || ''} : b);
  return { id:'main', d:data, blocks };
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function naverMapUrl(d){
  const q = (d.mapQuery || d.venueAddress || d.venueName || '').trim();
  return q ? 'https://map.naver.com/p/search/' + encodeURIComponent(q) : '';
}

/* ================= 사진 슬라이드 ================= */
function buildCarousel(list){
  const wrap = el('div', 'carousel');
  const track = el('div', 'carousel-track');
  const dots = el('div', 'carousel-dots');
  wrap.appendChild(track);
  const idxOf = () => Math.round(track.scrollLeft / (track.clientWidth || 1));
  const go = i => track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' });
  if(!list.length){
    track.appendChild(el('div', 'carousel-empty', '사진 준비 중'));
  }else{
    list.forEach((p, i) => {
      const slide = el('div', 'carousel-slide');
      const img = document.createElement('img');
      img.className = 'ph px';
      img.src = p.image;
      img.alt = '';
      img.draggable = false;
      slide.appendChild(img);
      slide.appendChild(el('div', 'glare'));
      [[46,'12%',20+i*6+'%',34],[18,'80%',58-i*4+'%',52],[26,'68%','12%',-30]].forEach(([s,l,t,dd]) => {
        const b = el('span', 'bokeh px');
        b.style.cssText = `width:${s}px;height:${s}px;left:${l};top:${t};--d:${dd}`;
        slide.appendChild(b);
      });
      track.appendChild(slide);
      if(list.length > 1){
        const dot = el('span', 'carousel-dot' + (i===0 ? ' active' : ''));
        dot.style.cursor = 'pointer';
        dot.addEventListener('click', () => go(i));
        dots.appendChild(dot);
      }
    });
    const hint = el('div', 'tilthint', '기울여 보세요 ↔');
    hint.id = 'tiltHint';
    wrap.appendChild(hint);
  }
  if(list.length > 1){
    const prev = el('button', 'carousel-arrow prev', '‹'); prev.setAttribute('aria-label','이전 사진');
    const next = el('button', 'carousel-arrow next', '›'); next.setAttribute('aria-label','다음 사진');
    prev.addEventListener('click', () => go(Math.max(0, idxOf()-1)));
    next.addEventListener('click', () => go(Math.min(track.children.length-1, idxOf()+1)));
    wrap.appendChild(prev); wrap.appendChild(next);
  }
  wrap.appendChild(dots);
  track.addEventListener('scroll', () => {
    const i = idxOf();
    Array.from(dots.children).forEach((d,k) => d.classList.toggle('active', k===i));
  });
  let dragging = false, sx = 0, ss = 0;
  track.addEventListener('pointerdown', ev => {
    if(ev.pointerType === 'touch') return;
    dragging = true; sx = ev.clientX; ss = track.scrollLeft;
    track.setPointerCapture(ev.pointerId);
    track.style.scrollSnapType = 'none';
  });
  track.addEventListener('pointermove', ev => { if(dragging) track.scrollLeft = ss - (ev.clientX - sx); });
  const end = () => {
    if(!dragging) return;
    dragging = false;
    track.style.scrollSnapType = 'x mandatory';
    go(Math.max(0, Math.min(track.children.length-1, idxOf())));
  };
  track.addEventListener('pointerup', end);
  track.addEventListener('pointerleave', end);
  return wrap;
}

/* ================= 그리드 갤러리 + 라이트박스 ================= */
let lbList = [], lbI = 0;
function buildGallery(list){
  const box = el('div', 'gallery');
  box.appendChild(el('p', 'eyebrow rv', 'GALLERY'));
  const grid = el('div', 'grid rv');
  list.forEach((p, i) => {
    const t = el('button', 'tile');
    t.type = 'button';
    t.setAttribute('aria-label', `사진 ${i+1} 크게 보기`);
    const img = document.createElement('img');
    img.src = p.image; img.alt = ''; img.loading = 'lazy'; img.draggable = false;
    t.appendChild(img);
    t.addEventListener('click', () => openLb(list, i));
    grid.appendChild(t);
  });
  box.appendChild(grid);
  return box;
}
function showLb(){
  lbI = (lbI + lbList.length) % lbList.length;
  $('#lbImg').src = lbList[lbI].image;
  $('#lbC').textContent = `${lbI+1} / ${lbList.length}`;
}
function openLb(list, i){ lbList = list; lbI = i; showLb(); $('#lb').classList.add('on'); }
$('#lbX').onclick = () => $('#lb').classList.remove('on');
$('#lbP').onclick = () => { lbI--; showLb(); };
$('#lbN').onclick = () => { lbI++; showLb(); };
addEventListener('keydown', e => {
  if(!$('#lb').classList.contains('on')) return;
  if(e.key === 'Escape') $('#lbX').click();
  if(e.key === 'ArrowLeft') $('#lbP').click();
  if(e.key === 'ArrowRight') $('#lbN').click();
});
let lbsx = 0;
$('#lb').addEventListener('touchstart', e => { lbsx = e.touches[0].clientX; }, {passive:true});
$('#lb').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - lbsx;
  if(Math.abs(dx) > 50){ lbI += dx < 0 ? 1 : -1; showLb(); }
}, {passive:true});

/* ================= 달력 · D-day ================= */
function buildCalendar(dtStr, d){
  const dt = new Date(dtStr);
  if(isNaN(dt)) return null;
  const frag = document.createDocumentFragment();
  const y = dt.getFullYear(), mo = dt.getMonth(), first = new Date(y, mo, 1).getDay(), last = new Date(y, mo+1, 0).getDate();
  const cal = el('div', 'cal rv');
  const hd = el('div', 'row hd');
  [...'일월화수목금토'].forEach((c,i) => hd.appendChild(el('span', i===0 ? 'sun' : '', c)));
  cal.appendChild(hd);
  const row = el('div', 'row');
  for(let i=0;i<first;i++) row.appendChild(el('span'));
  for(let n=1;n<=last;n++){
    const w = (first+n-1) % 7;
    row.appendChild(el('span', n===dt.getDate() ? 'me' : (w===0 ? 'sun' : ''), String(n)));
  }
  cal.appendChild(row);
  frag.appendChild(cal);

  const today = new Date(); today.setHours(0,0,0,0);
  const t = new Date(dt); t.setHours(0,0,0,0);
  const diff = Math.round((t - today) / 864e5);
  const p = el('p', 'dday rv');
  if(diff > 0){
    p.appendChild(document.createTextNode('결혼식이 '));
    p.appendChild(el('b', null, diff + '일'));
    p.appendChild(document.createTextNode(' 남았습니다'));
  }else if(diff === 0){
    p.appendChild(el('b', null, '오늘'));
    p.appendChild(document.createTextNode('이 결혼식 날입니다'));
  }else{
    p.textContent = '함께해 주셔서 감사합니다';
  }
  frag.appendChild(p);
  return frag;
}

function setMeta(attr, key, val){
  let m = document.head.querySelector(`meta[${attr}="${key}"]`);
  if(!val){ if(m) m.remove(); return; }
  if(!m){ m = document.createElement('meta'); m.setAttribute(attr, key); document.head.appendChild(m); }
  m.setAttribute('content', val);
}
// 브라우저 탭 제목 등 (※ 카카오톡 등 크롤러는 위 OG-START~OG-END 정적 태그만 읽음)
function applyMeta(d){
  const f = (d.ogImage || '').trim();
  const title = (d.ogTitle || '').trim() || ((d.groomName && d.brideName) ? `${d.groomName} ♥ ${d.brideName} 결혼합니다` : '');
  const t = fmtDateTime(d.weddingDateTime);
  const desc = (d.ogDescription || '').trim() || [t.main !== '-' ? (t.main + ' ' + t.sub).trim() : '', d.venueName].filter(Boolean).join(' · ');
  if(title){ document.title = title; setMeta('property','og:title', title); }
  if(desc){ setMeta('name','description', desc); setMeta('property','og:description', desc); }
  if(f){ try{ setMeta('property','og:image', new URL(f, location.href).href); }catch(e){} }
}

/* ================= 렌더 ================= */
let io = null, introMade = false;
function observeReveal(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  }), {threshold:.12});
  document.querySelectorAll('.rv').forEach(n => io.observe(n));
}

function render(){
  if(!gotInv) return;
  const picked = pickDraft();
  // 새 청첩장 편집 화면(사이트의 /wedding/invitation)에서 꾸민 시안이면 새 디자인 페이지로 이동
  if(picked.d && picked.d.card){
    location.replace('../invite' + (wantedId ? '?d=' + encodeURIComponent(picked.id) : ''));
    return;
  }
  if(!gotPhotos) return;
  const { id, d, blocks } = picked;
  applyMeta(d);
  const list = photos.filter(p => (p.inviteId || 'main') === id);
  const card = $('#card'), content = $('#content');
  // 사진 블록은 카드 맨 위(content 바깥)에 있으면 전체 폭으로 보이도록 처리
  Array.from(card.querySelectorAll('.carousel')).forEach(n => n.remove());
  content.innerHTML = '';
  let hasGallery = false;
  blocks.forEach((b, i) => {
    if(b.type === 'photos'){
      const c = buildCarousel(list);
      // 내용이 이미 있으면 그 자리에서 content를 나눠 사진을 중간에 끼움
      if(content.childNodes.length === 0 && i === 0){ card.insertBefore(c, content); }
      else{ c.style.margin = '0 -30px 26px'; content.appendChild(c); }
      return;
    }
    if(b.type === 'gallery'){
      if(list.length){ content.appendChild(buildGallery(list)); hasGallery = true; }
      return;
    }
    if(b.type === 'eyebrow') content.appendChild(el('p', 'eyebrow rv', b.text || ''));
    else if(b.type === 'heading') content.appendChild(el('h2', 'heading rv', b.text || ''));
    else if(b.type === 'text') content.appendChild(el('p', 'phrase rv', b.text || ''));
    else if(b.type === 'divider') content.appendChild(el('div', 'divider'));
    else if(b.type === 'names'){
      const h = el('h1', 'names rv');
      const g = el('span', 'shine px', d.groomName || '신랑'); g.style.setProperty('--d', '6');
      const a = el('span', 'amp px', '·'); a.style.setProperty('--d', '-4');
      const br = el('span', 'shine px', d.brideName || '신부'); br.style.setProperty('--d', '-6');
      h.appendChild(g); h.appendChild(a); h.appendChild(br);
      content.appendChild(h);
    }else if(b.type === 'datetime'){
      const dt = fmtDateTime(d.weddingDateTime);
      content.appendChild(el('p', 'datetime rv', dt.main));
      content.appendChild(el('p', 'datetime-sub rv', dt.sub));
      const cal = buildCalendar(d.weddingDateTime, d);
      if(cal) content.appendChild(cal);
    }else if(b.type === 'venue'){
      if(d.venueName) content.appendChild(el('p', 'venue-name rv', d.venueName));
      if(d.venueAddress) content.appendChild(el('p', 'venue-address rv', d.venueAddress));
      const url = naverMapUrl(d);
      const acts = el('div', 'map-actions rv');
      if(url){
        const a = el('a', 'map-btn primary', '네이버지도로 보기');
        a.href = url; a.target = '_blank'; a.rel = 'noopener';
        acts.appendChild(a);
      }
      if(d.venueAddress){
        const cp = el('button', 'map-btn', '주소 복사');
        cp.addEventListener('click', async () => {
          try{ await navigator.clipboard.writeText(d.venueAddress); cp.textContent = '복사됨 ✓'; }
          catch(e){ cp.textContent = d.venueAddress; }
          setTimeout(() => { cp.textContent = '주소 복사'; }, 1800);
        });
        acts.appendChild(cp);
      }
      if(acts.childNodes.length) content.appendChild(acts);
    }
  });
  // 갤러리 블록이 따로 없으면 맨 아래에 자동으로 붙임
  if(!hasGallery && list.length > 1){
    content.appendChild(el('div', 'divider'));
    content.appendChild(buildGallery(list));
  }
  $('#loadingState').style.display = 'none';
  card.style.display = 'block';
  observeReveal();
  if(!introMade){ introMade = true; makeIntro(d); }
}

/* ================= 인트로 (iOS는 터치로 센서 권한을 받아야 함) ================= */
function makeIntro(d){
  const wrap = el('div', 'intro');
  const o1 = el('div', 'orb'); o1.style.cssText = 'width:200px;height:200px;background:#F4D3CB;left:-50px;top:10%';
  const o2 = el('div', 'orb'); o2.style.cssText = 'width:240px;height:240px;background:#EBD9B8;right:-80px;bottom:8%';
  wrap.appendChild(o1); wrap.appendChild(o2);
  wrap.appendChild(el('div', 'small', 'WE ARE GETTING MARRIED'));
  wrap.appendChild(el('h1', null, `${d.groomName || '신랑'} ♥ ${d.brideName || '신부'}`));
  const p = el('p'); p.appendChild(document.createTextNode('휴대폰을 기울이고, 흔들어 보세요.')); p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode('청첩장이 함께 움직여요.'));
  wrap.appendChild(p);
  const btn = el('button', 'open-btn', '청첩장 열기'); btn.type = 'button';
  btn.addEventListener('click', async () => {
    await enableSensors();                 // iOS: 터치 이벤트 안에서 권한 요청
    wrap.classList.add('hide');
    setTimeout(() => wrap.remove(), 1000);
    setTimeout(() => burst(), 500);
    $('#motionBtn').style.display = 'block';
    setTimeout(() => { const h = $('#tiltHint'); if(h) h.style.opacity = '0'; }, 5000);
  });
  wrap.appendChild(btn);
  document.body.appendChild(wrap);
}

/* ================= 모션 센서 ================= */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const root = document.documentElement;
const clamp = (v, a=-1, b=1) => Math.max(a, Math.min(b, v));
const tilt = {x:0, y:0, tx:0, ty:0};
let sensorOn = false, gotEvent = false, baseBeta = null, motionOn = !reduce, sensorsAsked = false;

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800); }

function onOri(e){
  if(e.gamma == null || e.beta == null) return;
  gotEvent = true; sensorOn = true;
  if(baseBeta === null) baseBeta = e.beta;       // 처음 잡은 각도를 중립으로
  baseBeta += (e.beta - baseBeta) * 0.003;       // 천천히 재보정
  tilt.tx = clamp(e.gamma / 25);
  tilt.ty = clamp((e.beta - baseBeta) / 25);
}
let lastA = null, lastShake = 0;
function onMotion(e){
  const a = e.accelerationIncludingGravity, r = e.rotationRate;
  let jolt = 0;
  if(a && a.x != null){
    if(lastA) jolt = Math.abs(a.x-lastA.x) + Math.abs(a.y-lastA.y) + Math.abs(a.z-lastA.z);
    lastA = {x:a.x, y:a.y, z:a.z};
  }
  const spin = r ? Math.abs(r.alpha||0) + Math.abs(r.beta||0) + Math.abs(r.gamma||0) : 0;
  const now = Date.now();
  if((jolt > 30 || spin > 420) && now - lastShake > 1200){ lastShake = now; burst(true); }
}
async function enableSensors(){
  if(sensorsAsked) return sensorOn;
  sensorsAsked = true;
  const DM = window.DeviceMotionEvent, DO = window.DeviceOrientationEvent;
  if(!DM && !DO) return false;
  try{
    const reqs = [];
    if(DM && typeof DM.requestPermission === 'function') reqs.push(DM.requestPermission());
    if(DO && typeof DO.requestPermission === 'function') reqs.push(DO.requestPermission());
    if(reqs.length){
      const res = await Promise.all(reqs.map(p => p.catch(() => 'denied')));
      if(!res.includes('granted')) return false;
    }
  }catch(err){ return false; }
  addEventListener('deviceorientation', onOri, true);
  addEventListener('devicemotion', onMotion, true);
  return true;
}
// 센서가 없을 때(PC 등) 마우스 움직임으로 대체
addEventListener('pointermove', e => {
  if(sensorOn || e.pointerType === 'touch') return;
  tilt.tx = (e.clientX / innerWidth - .5) * 2; tilt.ty = (e.clientY / innerHeight - .5) * 2;
}, {passive:true});

$('#motionBtn').addEventListener('click', () => {
  motionOn = !motionOn;
  $('#motionBtn').textContent = motionOn ? '모션 끄기' : '모션 켜기';
  $('#petals').style.display = motionOn ? 'block' : 'none';
  if(!motionOn){ tilt.tx = tilt.ty = 0; }
});

/* ================= 꽃잎 파티클 ================= */
const cv = $('#petals'), ctx = cv.getContext('2d');
let W = 0, H = 0, petals = [];
function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();
function mk(fromBurst){
  const p = { x:Math.random()*W, y:-20-Math.random()*H*.5, s:6+Math.random()*7, r:Math.random()*6.28, vr:(Math.random()-.5)*.04,
    vy:.5+Math.random()*.9, vx:0, ph:Math.random()*6.28, a:.5+Math.random()*.4, bx:0, by:0, life:null,
    hue: Math.random() < .25 ? '255,226,200' : '244,188,196' };
  if(fromBurst){
    p.x = W/2 + (Math.random()-.5)*120; p.y = H*.55;
    const ang = Math.random()*6.28, sp = 4 + Math.random()*9;
    p.bx = Math.cos(ang)*sp; p.by = Math.sin(ang)*sp - 6; p.life = 1; p.s += 3;
  }
  return p;
}
if(!reduce){ for(let i=0;i<20;i++){ const p = mk(); p.y = Math.random()*H; petals.push(p); } }
function burst(shake){
  if(!motionOn || reduce) return;
  for(let i=0;i<70;i++) petals.push(mk(true));
  if(shake){ toast('🌸 축하해 주셔서 감사합니다'); navigator.vibrate && navigator.vibrate(30); }
}
function drawPetals(){
  ctx.clearRect(0, 0, W, H);
  if(!motionOn) return;
  for(let i = petals.length-1; i >= 0; i--){
    const p = petals[i];
    p.vx += (tilt.x*1.6 - p.vx) * .03;            // 기울인 쪽으로 바람
    p.ph += .03;
    p.x += p.vx + Math.sin(p.ph)*.5 + p.bx; p.y += p.vy + tilt.y*.5 + p.by;
    p.bx *= .94; p.by *= .94; p.r += p.vr;
    if(p.y > H+20 || p.x < -40 || p.x > W+40){
      if(p.life !== null){ petals.splice(i,1); continue; }
      p.y = -20; p.x = Math.random()*W; p.vx = 0;
    }
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, .55 + .45*Math.abs(Math.sin(p.ph)));
    ctx.fillStyle = `rgba(${p.hue},${p.a})`;
    ctx.beginPath(); ctx.moveTo(0,-p.s); ctx.bezierCurveTo(p.s*.9,-p.s*.6,p.s*.7,p.s*.6,0,p.s); ctx.bezierCurveTo(-p.s*.7,p.s*.6,-p.s*.9,-p.s*.6,0,-p.s); ctx.fill();
    ctx.restore();
  }
}

/* 메인 루프: 기울기 값을 CSS 변수로 내보내면 .px / 갤러리 / 글자 빛이 함께 움직임 */
let ox = 9, oy = 9;
function loop(){
  if(!reduce){
    tilt.x += (tilt.tx - tilt.x) * .09; tilt.y += (tilt.ty - tilt.y) * .09;
    if(Math.abs(tilt.x-ox) > .001 || Math.abs(tilt.y-oy) > .001){
      ox = tilt.x; oy = tilt.y;
      root.style.setProperty('--tx', tilt.x.toFixed(3));
      root.style.setProperty('--ty', tilt.y.toFixed(3));
    }
  }
  drawPetals();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

onSnapshot(invitationRef, snap => { invData = snap.exists() ? snap.data() : {}; gotInv = true; render(); });
onSnapshot(photosCol, snap => {
  photos = snap.docs.map(x => x.data()).sort((a,b)=> (a.order||0)-(b.order||0));
  gotPhotos = true; render();
});
</script>
</body>
